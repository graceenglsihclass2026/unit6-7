<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>Lesson 6-7 영어 지문 복습 (학생용)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#112233;--mute:#566878;--line:#d3dde5;--a:#0e8a7d;--bad:#c2362b;--good:#1e8449;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--card:#17222b;--ink:#e8eef3;--mute:#9db0be;--line:#2b3a46;--bad:#ff7a6e;--good:#5fd38d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161d;--card:#17222b;--ink:#e8eef3;--mute:#9db0be;--line:#2b3a46;--bad:#ff7a6e;--good:#5fd38d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 56px}
nav{display:flex;gap:8px;margin-bottom:14px}
nav a{flex:1;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.95rem;display:flex;gap:8px;align-items:center}
nav a small{display:block;font-weight:400;color:var(--mute);font-size:.75rem}
nav a[aria-current=page]{background:var(--c);border-color:var(--c);color:#fff}
nav a[aria-current=page] small{color:#ffffffd0}
nav .em{font-size:1.5rem}
.hero{background:var(--a);color:#fff;border-radius:18px;padding:22px 22px 18px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero h1{font-family:"Noto Serif KR",serif;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.2;margin:0 0 4px}
.hero p{margin:0;opacity:.92}
.score{background:#ffffff26;border-radius:14px;padding:8px 16px;text-align:center;font-weight:900;font-size:1.6rem;line-height:1.2}
.score small{display:block;font-size:.75rem;font-weight:500}
section{margin-top:26px}
h2{font-size:1.2rem;margin:0 0 4px;display:flex;gap:8px;align-items:center}
h2 i{font-style:normal;background:var(--a);color:#fff;border-radius:8px;min-width:28px;height:28px;display:inline-grid;place-items:center;font-size:.9rem}
.desc{margin:0 0 12px;color:var(--mute);font-size:.92rem}
.flow{display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.stage{flex:1 1 0;min-width:190px;display:flex;flex-direction:column;gap:8px}
.stage>b{font-size:.85rem;color:var(--a);padding-left:2px}
.node{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:.92rem;line-height:1.4}
.node em{font-style:normal;font-size:1.7rem}
.node.bad{border-color:var(--bad)}.node.good{border-color:var(--good)}
.arrow{align-self:center;font-size:1.6rem;color:var(--a);font-weight:900}
@media (max-width:720px){.flow{flex-direction:column;overflow:visible}.arrow{transform:rotate(90deg)}.stage{min-width:0}}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:104px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.card b{font-size:1.1rem}.card span{font-size:.8rem;color:var(--mute)}
.card.flip{background:color-mix(in srgb,var(--a) 14%,var(--card));border-color:var(--a)}
.card .ko{font-weight:700;color:var(--ink);font-size:1rem}
.card .ex{font-family:"Noto Serif KR",serif;font-size:.8rem;line-height:1.4}
details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}
.para{display:flex;gap:10px;margin:12px 0 0;font-family:"Noto Serif KR",serif;font-size:.98rem;line-height:1.85}
.para u{font-family:"Noto Sans KR",sans-serif;text-decoration:none;flex:none;background:var(--a);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:.75rem;font-weight:700;margin-top:6px}
mark{background:color-mix(in srgb,var(--a) 28%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.q p{margin:0 0 8px;font-family:"Noto Serif KR",serif;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.opts button:hover{border-color:var(--a)}
.opts button.ok{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.opts button.no{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-color-scheme:dark){.opts button.ok,.opts button.no{color:#0e161d}}
.w{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.w p{margin:0 0 8px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips span{background:color-mix(in srgb,var(--a) 16%,var(--card));border-radius:999px;padding:2px 10px;font-size:.8rem}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.model{margin-top:8px;font-family:"Noto Serif KR",serif;background:color-mix(in srgb,var(--good) 14%,var(--card));border-left:5px solid var(--good);border-radius:8px;padding:8px 12px;display:none}
.model.on{display:block}
.btn{margin-top:8px;background:var(--a);color:#fff;border:0;border-radius:10px;padding:7px 14px;font-weight:700}
.foot{margin-top:30px;text-align:center;font-size:.8rem;color:var(--mute)}
.foot button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--mute)}
.sid{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.sid input{width:110px;font:inherit;font-weight:700;letter-spacing:.15em;border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.sid small{color:var(--mute)}
.t h1{font-family:"Noto Serif KR",serif;margin:0 0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--bad)}.bar i.g{background:var(--good)}
.pill{display:inline-block;border-radius:999px;padding:0 10px;font-weight:700;font-size:.85rem;background:var(--line);margin-right:4px}
.pill.g{background:var(--good);color:#fff}.pill.b{background:var(--bad);color:#fff}
@media (prefers-color-scheme:dark){.pill.g,.pill.b{color:#0e161d}}
.opts button.key{border-color:var(--good);border-width:3px}.opts small{opacity:.85;font-weight:400;margin-left:4px}.ans{font-family:"Noto Serif KR",serif;margin:6px 0;padding:6px 10px;border-left:4px solid var(--a);background:var(--bg);border-radius:6px;white-space:pre-wrap}.q .pill{font-weight:500;margin-left:6px}.sid.t{border-color:var(--a)}.sid select{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px;background:var(--bg);color:var(--ink)}.sid .btn{margin-top:0}
.t details{margin-bottom:8px}.t .ans{font-family:"Noto Serif KR",serif;margin:6px 0;padding:6px 10px;border-left:4px solid var(--a);background:var(--bg);border-radius:6px;white-space:pre-wrap}
.t .btn.red{background:var(--bad)}.tbar{display:flex;gap:8px;flex-wrap:wrap}
.tm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:20;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 18px;font-weight:900;font-size:1.4rem;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px #0005}
.tm.low{background:var(--bad);color:#fff}.tm.end{animation:bl 1s infinite}@keyframes bl{50%{opacity:.4}}
.tc{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.proj::after{content:"";position:fixed;inset:0;background:var(--bg);z-index:15}
.proj .sid.t{position:fixed;top:0;left:0;right:0;z-index:25;margin:0;border-radius:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.proj .tm{top:50%;right:auto;left:50%;transform:translate(-50%,-50%);font-size:min(22vw,38vh);padding:.05em .45em;z-index:20}
.proj .tm.end{animation:none}
.proj .toast{top:auto;bottom:8vh;font-size:min(5vw,2.4rem);z-index:20;max-width:90vw}
.tc input{font:inherit;width:230px;max-width:100%;border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.qk{font:inherit;font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:30;max-width:min(92vw,640px);background:var(--a);color:#fff;border-radius:16px;padding:12px 16px;font-weight:700;font-size:1.1rem;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px #0006;animation:pop .3s}
.toast[hidden]{display:none}.toast button{background:#fff;color:#111;border:0;border-radius:10px;padding:4px 12px;font-weight:700}
@keyframes pop{from{transform:translate(-50%,-12px);opacity:0}}
.sid input#nm{width:110px;letter-spacing:0}.sid input#cc,.sid input#tcc{width:84px;letter-spacing:0}
.qrp{position:fixed;inset:0;z-index:40;background:#000b;display:grid;place-items:center}.qrp[hidden]{display:none}
.qrc{background:#fff;color:#111;border-radius:20px;padding:22px;text-align:center;max-width:92vw}
.qrc h2{justify-content:center;margin:0 0 10px}#qrbox{display:grid;place-items:center;min-height:120px;margin-bottom:10px;word-break:break-all}
.qrc input{width:min(80vw,420px);font:inherit;font-size:.85rem;border:2px solid #ccd;border-radius:8px;padding:6px 8px;background:#fff;color:#111}
.qrc p{color:#445;font-size:.85rem;margin:8px 0}
</style>
</head>

<script>
const O1=[`Disasters come suddenly, and technology is not enough.`,`Selfish behavior hurts the whole community.`,`Stay calm, follow rules, and help others.`,`Cooperation makes a community safer.`];
const D=[
{id:'p1',c:'#0e8a7d',e:'🤝',t:'When Disaster Strikes',k:'재난이 닥칠 때',
 flow:[{h:'1. 재난 발생',n:[['🌊','Floods may cover roads'],['🏚️','Earthquakes may destroy buildings'],['⛈️','Storms may cut off electricity']]},
 {h:'2. 사람들의 선택',n:[['😟','Selfish: take too much food and water','bad'],['🤝','Cooperate: share supplies, check on neighbors, help people in danger','good']]},
 {h:'3. 결과',n:[['💔','The whole community suffers','bad'],['🏘️','The community becomes stronger and safer','good']]}],
 vocab:[['disaster','재난','Natural disasters can happen without warning.'],['warning','경고','Receiving an emergency warning, residents should stay calm.'],['community','지역 사회','The whole community would suffer.'],['cooperation','협력','It is cooperation that makes a community stronger.'],['selfishness','이기심','It is cooperation, not selfishness.'],['supplies','물품','They can share supplies.'],['prevent','막다','People cannot always prevent natural disasters.'],['reduce','줄이다','They can reduce the damage.'],['resident','주민','Residents should stay calm.'],['emergency','비상 상황','Some people may need extra help during an emergency.']],
 txt:[`Natural <mark>disasters</mark> can happen without <mark>warning</mark> and change people’s lives in a short time. Floods may cover roads, earthquakes may destroy buildings, and strong storms may cut off electricity. Modern technology can help people predict some natural disasters, but it cannot protect everyone by itself.`,`During a disaster, some people think only about their own safety. They may take too much food or water and leave little for others. If people cared only about themselves, the whole <mark>community</mark> would suffer. Children, older people, and those with disabilities may need extra help during an emergency.`,`Receiving an emergency warning, <mark>residents</mark> should stay calm and follow safety rules. They can share <mark>supplies</mark>, check on their neighbors, and help people who are in danger. Even a small act of kindness can save a life and give hope to someone in need.`,`It is <mark>cooperation</mark>, not selfishness, that makes a community stronger. People cannot always prevent natural disasters, but they can reduce the damage by preparing and working together. A community becomes safer when its members care for others and work together for everyone’s safety.`],
 qs:[{h:'문단과 중심 내용 연결하기',d:'각 문단에 어울리는 중심 내용을 고르세요.',i:[[`Paragraph 1`,O1,0],[`Paragraph 2`,O1,1],[`Paragraph 3`,O1,2],[`Paragraph 4`,O1,3]]},
 {h:'빈칸에 알맞은 말 고르기',d:'본문 표현을 떠올리며 빈칸을 채워요.',i:[[`It is ______, not selfishness, that makes a community stronger.`,['warning','cooperation','electricity'],1],[`People cannot always ______ natural disasters, but they can reduce the damage.`,['ignore','buy','prevent'],2],[`Residents should stay calm and follow safety ______.`,['rules','supplies','buildings'],0],[`Children, older people, and those with disabilities may need ______ help.`,['little','extra','no'],1]]},
 {h:'True or False?',d:'본문 내용과 같으면 True, 다르면 False.',i:[[`Taking too much food or water can leave little for others.`,['True','False'],0],[`Modern technology can protect everyone by itself.`,['True','False'],1],[`Only children may need extra help during an emergency.`,['True','False'],1],[`People can reduce the damage by preparing and working together.`,['True','False'],0]]}],
 w:[['What lesson can we learn from the passage?',['care for','work together'],`We should care for one another and work together during a natural disaster.`],['How can people help others during a natural disaster?',['share supplies','check on','neighbors'],`They can share supplies, check on their neighbors, and help people who are in danger.`]]},
{id:'p2',c:'#d9480f',e:'🔥',t:'When Forests Burn',k:'숲이 불탈 때',
 flow:[{h:'1. 산불의 원인',n:[['☀️','Dry weather'],['💨','Strong winds'],['🚬','Human carelessness'],['🌡️','Warmer climate']]},
 {h:'2. 산불 발생',n:[['🌲','Wildfires spread quickly and destroy forests'],['🏘️','2025 Korea: villagers saw smoke, heard warnings, and left quickly']]},
 {h:'3. 기술의 도움',n:[['🚁','Drones with thermal cameras find fires early'],['🛰️','Satellites give information'],['📱','Emergency messages warn residents']]},
 {h:'4. 우리의 역할',n:[['🧑‍🚒','Firefighters cannot control every wildfire alone'],['🙋','Everyone should do their part to prevent wildfires']]}],
 vocab:[['wildfire','산불','Every year, wildfires destroy forests.'],['spread','퍼지다','They spread quickly because of dry weather.'],['carelessness','부주의','Many wildfires are caused by human carelessness.'],['frequently','자주','Wildfires have been occurring more frequently.'],['climate','기후','The Earth’s climate has become warmer.'],['equipped with','~을 갖춘','Drones equipped with thermal cameras.'],['thermal','열을 감지하는','Thermal cameras find fires early.'],['monitor','감시하다','Satellites monitor forests from space.'],['respond','대응하다','Technology helps firefighters respond more quickly.'],['depend on','~에 달려 있다','Safe forests depend on our actions.']],
 txt:[`Every year, <mark>wildfires</mark> destroy forests around the world. They <mark>spread</mark> quickly because of dry weather and strong winds, and many wildfires are also caused by human <mark>carelessness</mark>. It is important for everyone to understand that even a small mistake can lead to a major disaster.`,`Wildfires have been occurring more <mark>frequently</mark> as the Earth’s <mark>climate</mark> has become warmer. However, if people were more careful, many wildfires could be prevented.`,`In the spring of 2025, a large wildfire broke out in southeastern Korea. Before firefighters arrived, the fire had already spread across the forest due to strong winds. Seeing heavy smoke and hearing warnings to leave, the villagers quickly left their homes.`,`Today, modern technology helps firefighters <mark>respond</mark> to wildfires more quickly. Drones <mark>equipped with</mark> <mark>thermal</mark> cameras make it possible to find fires early. Satellites that <mark>monitor</mark> forests from space provide useful information to firefighters. With this information, emergency messages can be sent immediately to warn nearby residents. Even with these technologies, wildfires are still difficult to control.`,`It is brave of firefighters to risk their lives, but they cannot control every wildfire on their own. In addition, it is often people, not just nature, that cause serious wildfires. That is why everyone should do their part to prevent wildfires. Whether forests will remain safe <mark>depends on</mark> our actions.`],
 qs:[{h:'2025년 산불, 순서대로 놓기',d:'일어난 순서를 고르세요.',i:[[`The villagers quickly left their homes.`,['1st','2nd','3rd','4th'],3],[`A large wildfire broke out in southeastern Korea.`,['1st','2nd','3rd','4th'],0],[`Villagers saw heavy smoke and heard warnings.`,['1st','2nd','3rd','4th'],2],[`The fire spread across the forest before firefighters arrived.`,['1st','2nd','3rd','4th'],1]]},
 {h:'원인과 결과 연결하기',d:'원인 뒤에 이어질 결과를 고르세요.',i:[[`The Earth’s climate has become warmer →`,['Wildfires occur more frequently','Fires are found early','Warnings reach residents quickly','Wildfires spread quickly'],0],[`Drones equipped with thermal cameras →`,['Wildfires occur more frequently','Fires are found early','Warnings reach residents quickly','Wildfires spread quickly'],1],[`Emergency messages are sent immediately →`,['Wildfires occur more frequently','Fires are found early','Warnings reach residents quickly','Wildfires spread quickly'],2],[`Dry weather and strong winds →`,['Wildfires occur more frequently','Fires are found early','Warnings reach residents quickly','Wildfires spread quickly'],3]]},
 {h:'True or False?',d:'본문 내용과 같으면 True, 다르면 False.',i:[[`Wildfires are caused only by nature.`,['True','False'],1],[`Satellites monitor forests from space.`,['True','False'],0],[`Even a small mistake can lead to a major disaster.`,['True','False'],0],[`Firefighters can control every wildfire alone.`,['True','False'],1]]}],
 w:[['Why have wildfires been occurring more often in recent years?',['more frequently','climate','warmer'],`Wildfires have been occurring more frequently because the Earth’s climate has become warmer.`],['What technologies are used today to help firefighters respond to wildfires more quickly?',['drones','thermal cameras','satellites'],`Drones equipped with thermal cameras and satellites that monitor forests are used to help firefighters.`]]},
{id:'p3',c:'#9a6700',e:'🌡️',t:'Heat Waves: A Silent Disaster',k:'조용한 재난, 폭염',
 flow:[{h:'1. 원인',n:[['🌡️','The Earth’s average temperature has risen'],['☀️','Heat waves last longer and become more severe']]},
 {h:'2. 예측',n:[['🛰️','Satellites send information'],['🧠','Smart weather systems predict dangerous heat waves']]},
 {h:'3. 경고',n:[['📱','Emergency text messages help people recognize the danger']]},
 {h:'4. 행동',n:[['💧','Drink enough water'],['🏠','Avoid outdoor activities'],['👀','Pay attention to warning messages']]},
 {h:'5. 결과',n:[['💚','Serious health problems are prevented and lives are saved','good']]}],
 vocab:[['heat wave','폭염','Heat waves can be as dangerous as other disasters.'],['underestimate','과소평가하다','It is easy to underestimate the danger.'],['severe','심각한','Heat waves are becoming more severe.'],['heat-related','열과 관련된','Many heat-related illnesses can be prevented.'],['prepared','준비된','People should be better prepared.'],['extreme','극심한','During an extreme heat wave…'],['recognize','알아차리다','Messages help them recognize the danger.'],['predict','예측하다','Smart systems predict dangerous heat waves.'],['ultimately','궁극적으로','Ultimately, it is our actions that protect us.'],['basic steps','기본 조치','These basic steps can save lives.']],
 txt:[`Many people think that <mark>heat waves</mark> are simply part of hot summer weather. However, they can be just as dangerous as other natural disasters. Yet, it is easy for many people to <mark>underestimate</mark> the danger of heat waves.`,`In recent years, heat waves have lasted longer because the Earth's average temperature has risen. Although heat waves are becoming more <mark>severe</mark>, many <mark>heat-related</mark> illnesses can be prevented if people are better <mark>prepared</mark>.`,`During an <mark>extreme</mark> heat wave, the temperature often reaches a dangerous level before many people realize the risk. Emergency text messages sent to people's phones help them <mark>recognize</mark> the danger and follow safety advice. These early warnings are made possible by smart weather systems that use information from satellites to <mark>predict</mark> dangerous heat waves.`,`To stay safe during a heat wave, people should take simple but important actions, such as drinking enough water, avoiding outdoor activities, and paying attention to warning messages. These <mark>basic steps</mark> can prevent serious health problems and save lives. <mark>Ultimately</mark>, it is our actions, not the weather, that protect us from danger. A well-prepared community is always much safer when extreme heat arrives.`],
 qs:[{h:'빈칸에 알맞은 말 고르기',d:'본문 표현을 떠올리며 빈칸을 채워요.',i:[[`Heat waves have lasted longer because the Earth’s average ______ has risen.`,['rainfall','temperature','noise'],1],[`______ text messages help people recognize the danger.`,['Funny','Private','Emergency'],2],[`Smart weather systems use information from ______.`,['satellites','newspapers','neighbors'],0],[`It is our ______, not the weather, that protect us from danger.`,['clothes','actions','phones'],1]]},
 {h:'Safe or Risky?',d:'폭염 때 안전한 행동인지 위험한 행동인지 고르세요.',i:[[`Playing soccer outside at noon`,['Safe ✅','Risky ⚠️'],1],[`Drinking enough water`,['Safe ✅','Risky ⚠️'],0],[`Paying attention to warning messages`,['Safe ✅','Risky ⚠️'],0],[`Thinking heat waves are just normal summer weather`,['Safe ✅','Risky ⚠️'],1]]},
 {h:'원인과 결과 연결하기',d:'원인 뒤에 이어질 결과를 고르세요.',i:[[`The Earth’s average temperature has risen →`,['Heat waves last longer','Dangerous heat waves are predicted','People recognize the danger','Health problems are prevented'],0],[`Information from satellites →`,['Heat waves last longer','Dangerous heat waves are predicted','People recognize the danger','Health problems are prevented'],1],[`Emergency text messages →`,['Heat waves last longer','Dangerous heat waves are predicted','People recognize the danger','Health problems are prevented'],2],[`Simple actions like drinking water →`,['Heat waves last longer','Dangerous heat waves are predicted','People recognize the danger','Health problems are prevented'],3]]}],
 w:[['What is the main idea of the passage?',['well-prepared','reduce the danger'],`People can reduce the danger of heat waves by being well-prepared.`],['How do smart weather systems help people?',['predict','satellite','early warnings'],`They predict dangerous heat waves by using satellite information and make early warnings possible.`]]}
];

const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st={};try{st=JSON.parse(localStorage.getItem('rv6_7s')||'{}')}catch(e){}
Object.keys(st).forEach(k=>{if(/^[aw]\d/.test(k))delete st[k]});
const save=()=>{try{localStorage.setItem('rv6_7s',JSON.stringify(st))}catch(e){}};
const cur=()=>Math.max(0,D.findIndex(d=>d.id===location.hash.slice(1)));
const total=p=>p.qs.reduce((n,s)=>n+s.i.length,0);
const right=(p,pi)=>{let n=0;p.qs.forEach((s,si)=>s.i.forEach((it,k)=>{if(st['a'+pi+si+k]===it[2])n++}));return n};
function render(){
  const pi=cur(),p=D[pi];
  document.documentElement.style.setProperty('--a',p.c);
  $('#nav').innerHTML=D.map((d,i)=>`<a href="#${d.id}" style="--c:${d.c}" ${i===pi?'aria-current="page"':''}><span class="em">${d.e}</span><span>Page ${i+1}<small>${d.k}</small></span></a>`).join('');
  let h=`<div class="sid"><label>학번 <input id="sid" inputmode="numeric" maxlength="5" placeholder="30112" value="${esc(st.sid||'')}"></label><label>이름 <input id="nm" maxlength="10" placeholder="홍길동" value="${esc(st.nm||'')}"></label><small>입력한 내용은 이 기기에만 저장돼요.</small></div>`;
  h+=`<div class="hero"><div><p>Lesson 6-7 · Reading Review</p><h1>${p.e} ${p.t}</h1><p>${p.k}</p></div><div class="score"><span id="sc">${right(p,pi)}</span> / ${total(p)}<small>맞힌 문제</small><button class="btn" id="rs" style="margin-top:8px;background:#fff;color:#111;font-size:.85rem;padding:5px 12px">🔄 다시 풀기</button></div></div>`;
  h+=`<section><h2><i>1</i>한눈에 보기</h2><p class="desc">그림과 화살표를 따라 글의 흐름을 읽어 보세요.</p><div class="flow">`+p.flow.map((s,i)=>(i?'<div class="arrow">➜</div>':'')+`<div class="stage"><b>${s.h}</b>`+s.n.map(n=>`<div class="node ${n[2]||''}"><em>${n[0]}</em><span>${n[1]}</span></div>`).join('')+`</div>`).join('')+`</div></section>`;
  h+=`<section><h2><i>2</i>핵심 어휘 카드</h2><p class="desc">카드를 누르면 뜻과 본문 예문이 나와요. 뜻을 먼저 떠올려 보세요.</p><div class="vocab">`+p.vocab.map((v,k)=>`<button class="card" data-v="${k}"><b>${v[0]}</b><span>눌러서 뒤집기</span></button>`).join('')+`</div></section>`;
  h+=`<section><details><summary>📖 본문 다시 읽기 (핵심 어휘 표시)</summary>`+p.txt.map((t,i)=>`<div class="para"><u>${i+1}</u><div>${t}</div></div>`).join('')+`</details></section>`;
  p.qs.forEach((s,si)=>{h+=`<section><h2><i>${si+3}</i>${s.h}</h2><p class="desc">${s.d}</p>`+s.i.map((it,k)=>{const key='a'+pi+si+k,v=st[key];return `<div class="q"><p>${it[0]}</p><div class="opts">`+it[1].map((o,oi)=>`<button data-q="${key}" data-o="${oi}" data-r="${it[2]}" class="${v===oi?(oi===it[2]?'ok':'no'):''}">${o}</button>`).join('')+`</div></div>`}).join('')+`</section>`});
  h+=`<section><h2><i>${p.qs.length+3}</i>영어로 답 쓰기</h2><p class="desc">힌트 표현을 활용해 직접 써 보고, 예시 답안과 비교해 보세요.</p>`+p.w.map((w,k)=>`<div class="w"><p>${k+1}. ${w[0]}</p><div class="chips">`+w[1].map(c=>`<span>${c}</span>`).join('')+`</div><textarea data-w="w${pi}${k}" aria-label="답 쓰기" placeholder="Write your answer here.">${esc(st['w'+pi+k]||'')}</textarea><button class="btn" data-m="${k}">예시 답안 보기</button><div class="model" id="m${k}">${w[2]}</div></div>`).join('')+`</section>`;
  h+=`<section><h2><i>${p.qs.length+4}</i>내 결과 선생님께 보내기</h2><p class="desc">세 페이지의 점수와 영어 답이 한 번에 만들어져요. 복사해서 선생님이 알려 준 곳(구글 클래스룸 등)에 붙여 넣으세요.</p><button class="btn" id="mk">결과 만들고 복사하기</button><textarea id="out" readonly aria-label="내 결과" style="margin-top:10px;min-height:150px" placeholder="여기에 결과가 나와요."></textarea><small id="cp" class="desc"></small></section>`;
  $('#page').innerHTML=h;window.scrollTo(0,0);
}
function makeText(){
  const L=[`[Lesson 6-7 복습] 학번 ${st.sid||'-'} / 이름 ${st.nm||'-'}`];
  D.forEach((d,pi)=>{L.push('',`■ Page ${pi+1} ${d.t}: ${right(d,pi)}/${total(d)}`);d.w.forEach((x,k)=>{L.push(`Q${k+1}. ${x[0]}`,`A. ${st['w'+pi+k]||'(안 씀)'}`)})});
  return L.join('\n');
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]');
  if(v){const w=D[cur()].vocab[v.dataset.v],f=v.classList.toggle('flip');v.innerHTML=f?`<span class="ko">${w[1]}</span><span class="ex">${w[2]}</span>`:`<b>${w[0]}</b><span>눌러서 뒤집기</span>`;return}
  const q=e.target.closest('[data-q]');
  if(q){const o=+q.dataset.o;st[q.dataset.q]=o;save();q.parentNode.querySelectorAll('button').forEach(b=>b.className='');q.className=o===+q.dataset.r?'ok':'no';const pi=cur();$('#sc').textContent=right(D[pi],pi);return}
  if(e.target.id==='mk'){const t=makeText(),o=$('#out');o.value=t;o.select();
    const done=ok=>{$('#cp').textContent=ok?'✅ 복사됐어요! 붙여 넣기 하세요.':'위 글을 직접 선택해서 복사해 주세요.'};
    try{navigator.clipboard.writeText(t).then(()=>done(true),()=>{try{done(document.execCommand('copy'))}catch(x){done(false)}})}catch(x){try{done(document.execCommand('copy'))}catch(y){done(false)}}return}
  if(e.target.id==='rs'){if(!window._rsA){window._rsA=1;e.target.textContent='정말 지워요? 한 번 더';setTimeout(()=>{window._rsA=0;const b=$('#rs');if(b)b.textContent='🔄 다시 풀기'},4000);return}window._rsA=0;const pi=cur();for(const k of Object.keys(st))if(k.startsWith('a'+pi)||k.startsWith('w'+pi))delete st[k];save();render();if(typeof push==='function')push();return}
  const m=e.target.closest('[data-m]');
  if(m){$('#m'+m.dataset.m).classList.toggle('on')}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.w){st[e.target.dataset.w]=e.target.value;save()}
  if(e.target.id==='sid'){st.sid=e.target.value.replace(/\D/g,'').slice(0,5);e.target.value=st.sid;save()}
  if(e.target.id==='nm'){st.nm=e.target.value.slice(0,10);save()}
});
$('#reset').onclick=()=>{st={};save();render()};
addEventListener('hashchange',render);
render();
</script>
</body>
</html>
